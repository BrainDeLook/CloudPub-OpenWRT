name: Build OpenWrt packages

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      clo_version:
        description: 'CloudPub client version'
        required: false
        default: '3.5.1056'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build po2lmo (LuCI translation compiler)
        run: |
          git clone --depth=1 https://github.com/openwrt/luci /tmp/luci || exit 0
          src=$(find /tmp/luci -name 'po2lmo.c' -path '*src*' | head -n1) || true
          if [ -n "$src" ]; then
            dir=$(dirname "$src")
            ( cd "$dir" && make po2lmo 2>/dev/null || cc -o po2lmo po2lmo.c template_lmo.c ) || true
            [ -x "$dir/po2lmo" ] && sudo install -m 0755 "$dir/po2lmo" /usr/local/bin/po2lmo
          fi
          command -v po2lmo && echo "po2lmo ready" || echo "po2lmo unavailable, translations will be skipped"

      - name: Build packages
        env:
          CLO_VERSION: ${{ github.event.inputs.clo_version || '3.5.1056' }}
          RELEASE_VERSION: ${{ startsWith(github.ref_name, 'v') && github.ref_name || 'v3.5.1056-luci.4-beta.1' }}
        run: |
          docker run --rm -e CLO_VERSION="$CLO_VERSION" -e RELEASE_VERSION="$RELEASE_VERSION" -v "$PWD:/work" -w /work alpine:edge sh -ec '
            apk add --no-cache bash curl tar file gettext git build-base lua5.1-dev
            git clone --depth=1 https://github.com/openwrt/luci /tmp/luci
            src=$(find /tmp/luci -name po2lmo.c -path "*src*" | head -n1)
            if [ -n "$src" ]; then
              dir=$(dirname "$src")
              (cd "$dir" && make po2lmo) || true
              [ ! -x "$dir/po2lmo" ] || install -m 0755 "$dir/po2lmo" /usr/local/bin/po2lmo
            fi
            ./build.sh
          '
          sudo chown -R "$USER":"$(id -gn)" bin
          sed "s|@RELEASE_TAG@|$RELEASE_VERSION|g" install.sh > bin/install.sh
          chmod 0755 bin/install.sh

      - name: Validate OpenWrt 25.12.5 aarch64 package set
        run: |
          node --check luci-app-cloudpub/htdocs/luci-static/resources/view/cloudpub/overview.js
          test -s bin/cloudpub-3.5.1056-r1-aarch64_generic.apk
          test -s bin/luci-app-cloudpub-1.4.0-r1.apk
          docker run --rm -v "$PWD:/work:ro" -w /work alpine:edge sh -ec '
            apk manifest bin/cloudpub-3.5.1056-r1-aarch64_generic.apk >/dev/null
            apk manifest bin/luci-app-cloudpub-1.4.0-r1.apk >/dev/null
          sh -n cloudpub/files/cloudpub.init
          sh -n cloudpub/files/cloudpub-run
          sh tests/cloudpub-publication-toggle.sh
          sh -n luci-app-cloudpub/root/usr/libexec/cloudpub-update-check
          sh -n luci-app-cloudpub/root/usr/libexec/cloudpub-update
          sh -n bin/install.sh
          '

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cloudpub-openwrt-packages
          path: |
            bin/*.ipk
            bin/*.apk
            bin/install.sh

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: CloudPub OpenWrt ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-beta') }}
          files: |
            bin/*.ipk
            bin/*.apk
            bin/install.sh
            bin/release
