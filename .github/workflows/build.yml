name: Build OpenWrt packages

on:
  push:
    branches: [ main, master, 'claude/**' ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      clo_version:
        description: CloudPub client version
        required: false
        default: '3.2.2'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build IPK and APK packages
        env:
          CLO_VERSION: ${{ github.event.inputs.clo_version || '3.2.2' }}
        run: |
          docker run --rm -v "$PWD:/work" -w /work alpine:edge sh -ec '
            apk add --no-cache bash curl tar file gettext git build-base lua5.1-dev
            git clone --depth=1 https://github.com/openwrt/luci /tmp/luci
            src=$(find /tmp/luci -name po2lmo.c -path "*src*" | head -n1)
            if [ -n "$src" ]; then
              dir=$(dirname "$src")
              (cd "$dir" && make po2lmo) || true
              [ ! -x "$dir/po2lmo" ] || install -m 0755 "$dir/po2lmo" /usr/local/bin/po2lmo
            fi
            CLO_VERSION="${{ github.event.inputs.clo_version || '3.2.2' }}" ./build.sh
          '

      - name: Checksums
        run: cd bin && sha256sum *.ipk *.apk > SHA256SUMS

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cloudpub-openwrt-packages
          path: |
            bin/*.ipk
            bin/*.apk
            bin/SHA256SUMS
            install.sh

      - name: Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.clo_version || '3.2.2' }}
          name: CloudPub 3.2.2 for OpenWrt
          body: |
            CloudPub client 3.2.2 for OpenWrt.

            - IPK packages for OpenWrt 24.10 and older
            - APK packages for OpenWrt 25.12 and newer
            - Automatic installer for package-manager and architecture detection

            Quick install:
            `wget -qO- https://github.com/BrainDeLook/CloudPub-OpenWRT/releases/latest/download/install.sh | sh`
          files: |
            bin/*.ipk
            bin/*.apk
            bin/SHA256SUMS
            install.sh
          generate_release_notes: true

